[project]
name = "engineering-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "SQLAlchemy>=2.0.36",
    "psycopg[binary]>=3.2.2",
    "pgvector>=0.2.5",
    "sentence-transformers>=2.7.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1"
]

[tool.vercel]
entrypoint = "app.api.main:app"
